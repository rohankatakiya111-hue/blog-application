<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Blog - BlogVerse</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav>
      <div class="logo">
        <a href="index.html">📝 BlogVerse</a>
      </div>

      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>

        <a href="index.html">Home</a>

        <a href="#" onclick="logout()">Logout</a>
      </div>
    </nav>

    <div class="container">
      <div class="form-card create-blog-card">
        <div class="card-icon create-icon">✍️</div>

        <h2>Write a New Article</h2>

        <p class="form-subtitle">
          Share your knowledge, ideas and experiences with the BlogVerse
          community.
        </p>

        <form id="blogForm">
          <div class="form-group">
            <label for="title">BLOG TITLE</label>

            <input
              type="text"
              id="title"
              required
              placeholder="Enter an interesting blog title..."
            />
          </div>

          <div class="form-group">
            <label for="content">CONTENT</label>

            <textarea
              id="content"
              rows="12"
              required
              placeholder="Start writing your blog here..."
            ></textarea>
          </div>

          <div class="form-group">
            <label for="author">AUTHOR</label>

            <input
              type="text"
              id="author"
              required
              placeholder="Enter author name..."
            />
          </div>

          <div class="create-actions">
            <a href="dashboard.html" class="btn cancel-btn"> ← Cancel </a>

            <button type="submit" class="btn publish-btn">
              🚀 Publish Blog
            </button>
          </div>
        </form>
      </div>
    </div>

    <footer>
      <div>
        <h3>📝 BlogVerse</h3>

        <p>Write. Share. Inspire.</p>
      </div>

      <div class="footer-links">
        <a href="index.html">Home</a>

        <a href="dashboard.html">Dashboard</a>
      </div>

      <p class="copyright">© 2026 BlogVerse. Internship Project.</p>
    </footer>

    <script>
      const API_URL = "https://blogverse-backend-zr0p.onrender.com";

      const token = localStorage.getItem("token");

      const user = localStorage.getItem("user");

      if (!token || !user) {
        alert("Please login first.");

        window.location.href = "login.html";
      }

      document
        .getElementById("blogForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const title = document.getElementById("title").value.trim();

          const content = document.getElementById("content").value.trim();

          const author = document.getElementById("author").value.trim();

          console.log("Publish button clicked");

          try {
            const response = await fetch(`${API_URL}/api/blogs`, {
              method: "POST",

              headers: {
                "Content-Type": "application/json",

                Authorization: `Bearer ${token}`,
              },

              body: JSON.stringify({
                title: title,
                content: content,
                author: author,
              }),
            });

            const data = await response.json();

            console.log("Blog response:", data);

            if (response.ok) {
              alert("Blog created successfully!");

              window.location.href = "dashboard.html";
            } else if (response.status === 401) {
              localStorage.removeItem("token");

              localStorage.removeItem("user");

              alert("Session expired. Please login again.");

              window.location.href = "login.html";
            } else {
              alert(data.message || "Blog create failed!");
            }
          } catch (error) {
            console.error("Blog Error:", error);

            alert("Server sathe connect thai shakyu nahi!");
          }
        });

      function logout() {
        localStorage.removeItem("token");

        localStorage.removeItem("user");

        alert("Logout successful!");

        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
