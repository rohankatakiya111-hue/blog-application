<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Blog Details - BlogVerse</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      .blog-details-container {
        max-width: 900px;
        margin: 50px auto;
        padding: 30px;
      }

      .blog-details-card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .blog-details-card h1 {
        margin-bottom: 15px;
      }

      .blog-author {
        color: #666;
        margin-bottom: 25px;
      }

      .blog-content {
        line-height: 1.8;
        white-space: pre-wrap;
      }

      .blog-date {
        color: #888;
        font-size: 14px;
        margin-top: 25px;
      }

      .back-btn {
        display: inline-block;
        margin-bottom: 20px;
        padding: 10px 18px;
        background: #333;
        color: white;
        text-decoration: none;
        border-radius: 6px;
      }

      .error-message {
        color: red;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="blog-details-container">
      <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>

      <div id="blogDetails">
        <p>Loading blog...</p>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:5000/api/blogs";

      const params = new URLSearchParams(window.location.search);
      const blogId = params.get("id");

      const blogDetails = document.getElementById("blogDetails");

      async function loadBlog() {
        if (!blogId) {
          blogDetails.innerHTML =
            '<p class="error-message">Blog ID not found.</p>';
          return;
        }

        try {
          const response = await fetch(`${API_URL}/${blogId}`);

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Blog not found");
          }

          const blog = data.blog;

          blogDetails.innerHTML = `
          <div class="blog-details-card">
            <h1>${blog.title}</h1>

            <p class="blog-author">
              <strong>Author:</strong> ${blog.author}
            </p>

            <div class="blog-content">
              ${blog.content}
            </div>

            <p class="blog-date">
              Published: ${new Date(blog.createdAt).toLocaleString()}
            </p>
          </div>
        `;
        } catch (error) {
          console.error(error);

          blogDetails.innerHTML = `
          <p class="error-message">
            Unable to load blog details.
          </p>
        `;
        }
      }

      loadBlog();
    </script>
  </body>
</html>
