<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register - BlogVerse</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav>
      <div class="logo">
        <a href="index.html"> 📝 BlogVerse </a>
      </div>

      <div class="nav-links">
        <a href="index.html"> Home </a>

        <a href="login.html"> Login </a>

        <a href="register.html"> Register </a>
      </div>
    </nav>

    <div class="container">
      <div class="form-card register-card">
        <div class="card-icon register-icon">✨</div>

        <h2>Create Your Account</h2>

        <p class="form-subtitle">Join BlogVerse and start sharing your ideas</p>

        <form id="registerForm">
          <div class="form-group">
            <label for="name"> NAME </label>

            <input
              type="text"
              id="name"
              required
              placeholder="Enter your name"
            />
          </div>

          <div class="form-group">
            <label for="email"> E-MAIL ADDRESS </label>

            <input
              type="email"
              id="email"
              required
              placeholder="name@example.com"
            />
          </div>

          <div class="form-group">
            <label for="password"> PASSWORD </label>

            <input
              type="password"
              id="password"
              required
              placeholder="Create password"
            />
          </div>

          <button type="submit" class="btn register-btn">
            🚀 CREATE ACCOUNT
          </button>
        </form>

        <div class="form-footer">
          <p>
            Already have an account?

            <a href="login.html"> Login here </a>
          </p>
        </div>
      </div>
    </div>

    <footer>
      <div>
        <h3>📝 BlogVerse</h3>

        <p>Write. Share. Inspire.</p>
      </div>

      <div class="footer-links">
        <a href="index.html"> Home </a>

        <a href="login.html"> Login </a>
      </div>

      <p class="copyright">© 2026 BlogVerse. Internship Project.</p>
    </footer>

    <script src="main.js"></script>

    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const name = document.getElementById("name").value.trim();

          const email = document.getElementById("email").value.trim();

          const password = document.getElementById("password").value;

          console.log("Register button clicked");

          try {
            const response = await fetch(
              "http://localhost:5000/api/auth/register",
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json",
                },

                body: JSON.stringify({
                  name: name,
                  email: email,
                  password: password,
                }),
              },
            );

            const data = await response.json();

            console.log("Register response:", data);

            if (response.ok) {
              alert("Registration successful!");

              window.location.href = "login.html";
            } else {
              alert(data.message || "Registration failed!");
            }
          } catch (error) {
            console.error("Register Error:", error);

            alert("Server sathe connect thai shakyu nahi!");
          }
        });
    </script>
  </body>
</html>
